<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة القيادة المطورة | أ/ عبدالعزيز الفيفي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f8fafc; --card-bg: #ffffff; --accent: #0284c7;
            --text-main: #1e293b; --border: #e2e8f0;
            --correct: #dcfce7; --correct-text: #166534;
            --wrong: #fee2e2; --wrong-text: #991b1b;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: center; }
        th { background: #f1f5f9; }
        .btn-view { background: #0284c7; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        
        /* Modal Styles (نافذة المراجعة) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); overflow-y: auto; }
        .modal-content { background: white; margin: 5% auto; padding: 20px; width: 80%; max-width: 800px; border-radius: 15px; }
        .answer-item { padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee; }
        .ans-correct { background: var(--correct); color: var(--correct-text); }
        .ans-wrong { background: var(--wrong); color: var(--wrong-text); }
        .close-btn { float: left; cursor: pointer; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>📊 لوحة نتائج الطلاب الذكية</h2>
        <p>مرحباً بك أ/ عبدالعزيز. يمكنك هنا متابعة أداء الطلاب ومراجعة أخطائهم.</p>
    </div>

    <div class="card">
        <h3>جدول النتائج</h3>
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>اسم الطالب</th>
                    <th>الدرجة</th>
                    <th>التاريخ</th>
                    <th>المراجعة</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<div id="reviewModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle">تفاصيل إجابات الطالب</h3>
        <hr>
        <div id="reviewContent">
            </div>
    </div>
</div>

<script>
    // إعدادات Firebase الخاصة بك
    const firebaseConfig = { 
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0", 
        authDomain: "aztlg-494c3.firebaseapp.com", 
        projectId: "aztlg-494c3", 
        storageBucket: "aztlg-494c3.firebasestorage.app", 
        messagingSenderId: "597051893949", 
        appId: "1:597051893949:web:de5554ac900317a92b2fd4" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // الاستماع للنتائج بشكل حي
    db.collection("student_results").orderBy("time", "desc").onSnapshot(snapshot => {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        snapshot.forEach(doc => {
            const data = doc.data();
            const date = data.time ? new Date(data.time.seconds * 1000).toLocaleDateString('ar-SA') : '---';
            
            const row = `
                <tr>
                    <td>${data.name}</td>
                    <td><b>${data.score} / ${data.total}</b></td>
                    <td>${date}</td>
                    <td>
                        <button class="btn-view" onclick="openReview('${doc.id}')">👁️ مراجعة</button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    });

    // وظيفة فتح نافذة المراجعة
    function openReview(docId) {
        db.collection("student_results").doc(docId).get().then(doc => {
            const data = doc.data();
            document.getElementById('modalTitle').innerText = `مراجعة إجابات الطالب: ${data.name}`;
            const container = document.getElementById('reviewContent');
            container.innerHTML = '';

            if (data.answers && data.answers.length > 0) {
                data.answers.forEach((ans, index) => {
                    const statusClass = ans.isCorrect ? 'ans-correct' : 'ans-wrong';
                    const icon = ans.isCorrect ? '✅' : '❌';
                    
                    const item = `
                        <div class="answer-item ${statusClass}">
                            <strong>س ${index + 1}: ${ans.qText}</strong><br>
                            <span>إجابة الطالب: ${ans.studentAns} ${icon}</span><br>
                            ${!ans.isCorrect ? `<span>الإجابة الصحيحة: ${ans.correctAns}</span>` : ''}
                        </div>
                    `;
                    container.innerHTML += item;
                });
            } else {
                container.innerHTML = '<p style="text-align:center;">لا توجد بيانات تفصيلية لهذا الاختبار (قد يكون الطالب اختبر قبل تحديث الكود).</p>';
            }
            document.getElementById('reviewModal').style.display = "block";
        });
    }

    function closeModal() {
        document.getElementById('reviewModal').style.display = "none";
    }

    // إغلاق النافذة عند الضغط خارجها
    window.onclick = function(event) {
        if (event.target == document.getElementById('reviewModal')) closeModal();
    }
</script>

</body>
</html>
